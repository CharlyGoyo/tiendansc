<script src="/form_finalizar.js" defer></script>
<main class="main1">
	<script src="https://js.stripe.com/v3/"></script>
	<section class="section2">
		<form id="form1" action="/intent" method="post">
			<h4 class="h42">Facturación y envío</h4>
			<hr>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Nombre </em><em class="em4">*</em></b></p>
				<input class="input2" type="text" name="nombre" autocomplete="given-name" required>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Apellidos </em><em class="em4">*</em></b></p>
				<input class="input2" type="text" name="apellidos" autocomplete="family-name" required>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">País / Región </em><em class="em4">*</em></b></p>
				<select class="select1" name="region" autocomplete="country" required>
					<option value="ES" selected>España</option>
				</select>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Dirección </em><em class="em4">*</em></b></p>
				<input class="input2" type="text" name="direccion1" placeholder="Nombre de la calle y número de la casa" autocomplete="address-line1" required>
			</label>
			<input class="input2" type="text" name="direccion2" placeholder="Apartamento, habitación, etc. (opcional)" aria-label="Apartamento, habitación, etc. (opcional)" autocomplete="address-line2">
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Código postal / ZIP </em><em class="em4">*</em></b></p>
				<input class="input2" class="input2" type="text" name="postal" autocomplete="postal-code" required>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Población </em><em class="em4">*</em></b></p>
				<input class="input2" type="text" name="poblacion" autocomplete="address-level2" required>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Provincia </em><em class="em4">*</em></b></p>
				<input class="input3" name="provincia" autocomplete="address-level1" list="datalist1" placeholder="Elige una opción…" required>
				<datalist id="datalist1">
					<option value="La Coruña"></option>
					<option value="Álava"></option>
					<option value="Albacete"></option>
					<option value="Alicante"></option>
					<option value="Almería"></option>
					<option value="Asturias"></option>
					<option value="Ávila"></option>
					<option value="Badajoz"></option>
					<option value="Baleares"></option>
					<option value="Barcelona"></option>
					<option value="Burgos"></option>
					<option value="Cáceres"></option>
					<option value="Cádiz"></option>
					<option value="Cantabria"></option>
					<option value="Castellón"></option>
					<option value="Ceuta"></option>
					<option value="Ciudad Real"></option>
					<option value="Córdoba"></option>
					<option value="Cuenca"></option>
					<option value="Gerona"></option>
					<option value="Granada"></option>
					<option value="Guadalajara"></option>
					<option value="Guipúzcoa"></option>
					<option value="Huelva"></option>
					<option value="Huesca"></option>
					<option value="Jaén"></option>
					<option value="La Rioja"></option>
					<option value="Las Palmas"></option>
					<option value="León"></option>
					<option value="Lérida"></option>
					<option value="Lugo"></option>
					<option value="Madrid"></option>
					<option value="Málaga"></option>
					<option value="Melilla"></option>
					<option value="Murcia"></option>
					<option value="Navarra"></option>
					<option value="Orense"></option>
					<option value="Palencia"></option>
					<option value="Pontevedra"></option>
					<option value="Salamanca"></option>
					<option value="Santa Cruz de Tenerife"></option>
					<option value="Segovia"></option>
					<option value="Sevilla"></option>
					<option value="Soria"></option>
					<option value="Tarragona"></option>
					<option value="Teruel"></option>
					<option value="Toledo"></option>
					<option value="Valencia"></option>
					<option value="Valladolid"></option>
					<option value="Vizcaya"></option>
					<option value="Zamora"></option>
					<option value="Zaragoza"></option>
				</datalist>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Teléfono </em><em class="em4">*</em></b></p>
				<input class="input2" type="tel" name="telefono" autocomplete="tel" required>
			</label>
			<label class="label1">
				<p class="p3"><b class="b1"><em class="em1">Dirección de correo electrónico </em><em class="em4">*</em></b></p>
				<input class="input2" type="email" name="correo" autocomplete="email" required>
			</label>
			<h4 class="h42">Información adicional</h4>
			<hr>
			<label for="textarea1">
				<p class="p3"><b class="b1"><em class="em1">Notas del pedido (opcional)</em></b></p>
				<textarea id="textarea1" name="notas" rows="3" cols="5" placeholder="Notas sobre tu pedido, por ejemplo, notas especiales para la entrega."></textarea>
			</label>
		</form>

		<div class="div2" id="div1">
			<h4 class="h42">Tu pedido</h4>
			<table>
				<thead class="thead1">
					<tr class="tr1">
						<th class="th1">
							<p>Producto</p>
						</th>
						<th class="th1">
							<p class="p4">Subtotal</p>
						</th>
					</tr>
				</thead>
				<tbody>
					<tr class="tr1">
						<td><p>holllaaaa<br>x4</p></td>
						<td><p class="p4">€</p></td>
					</tr>
					<tr class="tr1">
						<td><p>Subtotal</p></td>
						<td><p class="p4">€</p></td>
					</tr>
					<tr class="tr1">
						<td><p>Envío</p></td>
						<td><p class="p4"><em class="em1">Estándar: 5,00 €</em></p></td>
					</tr>
					<tr class="tr1">
						<td><p>Total</p></td>
						<td><p class="p4">€</p></td>
					</tr>
				</tbody>
			</table>
			<p>Tus datos personales se utilizarán para procesar tu pedido: <a class="a2" href="/politica-de-privacidad">Política de privacidad</a>.</p>
			<label for="input1">
				<p><input id="input1" type="checkbox" name="terminos" required>
				He leído y estoy de acuerdo con los <a class="a2" href="/terminos">términos y condiciones</a> de la web <em class="em4">*</em></p>
			</label>

			<p data-stripe-status></p>
			<div id="payment-element"></div>
			<button id="button1" type="submit" form="form1">Realizar el pedido</button>
		</div>
	</section>
</main>
