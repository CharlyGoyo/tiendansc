<!DOCTYPE html>

<!--og es open graph, un estándar para dar información a las redes sociales. El link no lleva a ninguna parte...-->
<html lang="en-ES" prefix="og: https://ogp.me/ns#">

		<!--para autoajustar el tamaño y que la escala inicial sea 1-->

		<!--esto se supone que va bien para el SEO-->
		<link rel="profile" href="https://gmpg.org/xfn/11">
